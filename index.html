<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Payment Portal</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: #0b1220;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 12px;
}

.page {
  width: 100%;
  max-width: 520px;
  min-height: calc(100vh - 24px);
  min-height: calc(100dvh - 24px);
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

header {
  text-align: center;
  padding: 8px 0;
  flex-shrink: 0;
}

header h1 {
  font-size: 25px;
  margin: 5px;
}

header p {
  font-size: 12px;
  color: #a8b6cb;
  margin: 8px 0 0;
}

.card {
  background: #142238;
  border: 1px solid #30415b;
  border-radius: 18px;
  padding: 18px;
  flex-shrink: 0;
}

...amount-label {
font-size: 12px;
color: #a8b6cb;
text-align: center;
width: 100%;
display: block;
}

.amount {
font-size: 32px;
font-weight: bold;
color: #70edc3;
margin: 8px 0 20px;
text-align: center;
width: 100%;
display: block;

}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 14px 6px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.direct {
  background: #70edc3;
  color: #08251e;
}

.scan {
  background: #263b59;
  color: white;
  border: 1px solid #405777;
}

.qr-section {
  display: none;
  margin-top: 18px;
  text-align: center;
}

.qr-box {
  width: min(230px, 72vw);
  aspect-ratio: 1;
  background: #fff;
  padding: 8px;
  border-radius: 12px;
  margin: 0 auto;
}

.qr-box img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.qr-help {
  color: #a8b6cb;
  font-size: 12px;
  line-height: 1.5;
  margin: 12px 0;
}

.timer-box {
  background: #091321;
  border: 1px solid #30415b;
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
}

.timer-label {
  font-size: 12px;
  color: #a8b6cb;
}

#timer {
  font-size: 26px;
  font-weight: bold;
  color: #70edc3;
  margin-top: 5px;
}

#timerMessage {
  font-size: 11px;
  color: #ffe3a3;
  line-height: 1.5;
  margin-top: 7px;
}

footer {
  font-size: 10px;
  line-height: 1.6;
  text-align: center;
  color: #8797ad;
  padding: 0 5px 5px;
  flex-shrink: 0;
}

..bottom {
  background: transparent;
  border: none;
  border-radius: 9;
  padding: 0;
  text-align: center;
  margin-top: auto;
  flex-shrink: 0;
  box-shadow: none;
}

.bottom img {
  display: block;
  width: 100%;
  max-height: 70px;
  object-fit: contain;
  background: transparent;
  border: none;
  border-radius: 0;
}
}

@media (max-width: 360px) {
  body {
    padding: 8px;
  }

  .page {
    min-height: calc(100vh - 16px);
    min-height: calc(100dvh - 16px);
    gap: 8px;
  }

  header h1 {
    font-size: 22px;
  }

  .card {
    padding: 13px;
  }

  .amount {
    font-size: 28px;
    margin-bottom: 15px;
  }

  button {
    font-size: 11px;
    padding: 12px 4px;
  }

  .bottom img {
    max-height: 40px;
  }
}
</style>
</head>

<script>
/* =====================================
   1. APNA PAYMENT LINK YAHAN ADD KARO
   ===================================== */

const paymentLink = "upi://pay?pa=dsnoxtrustedseller@ybl&pn=Dargi%20Shiva&am=30&cu=INR&tn=Payment";

function directPayment() {
  if (!paymentLink) {
    alert("Payment link is missing.");
    return;
  }

  window.location.href = paymentLink;
}


let countdownInterval = null;
let secondsRemaining = 120;
let qrIsVisible = false;

function showQR() {
  const qrSection = document.getElementById("qrSection");
  const timerText = document.getElementById("timer");
  const timerMessage = document.getElementById("timerMessage");

  if (qrIsVisible) {
    qrSection.style.display = "none";
    qrIsVisible = false;

    if (countdownInterval !== null) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    return;
  }

  qrSection.style.display = "block";
  qrIsVisible = true;

  if (countdownInterval !== null) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }

  secondsRemaining = 240;
  timerMessage.textContent =
    "Please complete your payment using your UPI app.";

  updateTimer();

  countdownInterval = setInterval(function() {
    secondsRemaining--;
    updateTimer();

    if (secondsRemaining <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;

      timerText.textContent = "00:00";
      timerMessage.textContent =
        "Time ended. Check your UPI app or bank account to confirm payment.";
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(secondsRemaining / 60);
  const seconds = secondsRemaining % 60;

  document.getElementById("timer").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
}
</script>
